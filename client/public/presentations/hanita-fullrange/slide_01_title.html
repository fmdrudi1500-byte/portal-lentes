<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lentes FullRange Hanita</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            font-family: 'Open Sans', sans-serif;
            position: relative;
            overflow: hidden;
        }
        .title-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            color: #2c3e50;
            font-size: 64px;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        .subtitle-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            color: #34495e;
            font-size: 32px;
            line-height: 1.3;
        }
        .tagline-text {
            font-family: 'Open Sans', sans-serif;
            font-weight: 600;
            color: #c9a961;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .gold-accent {
            color: #c9a961;
        }
        .decorative-line {
            width: 120px;
            height: 6px;
            background: linear-gradient(90deg, #c9a961 0%, #2c3e50 100%);
        }
    </style>
</head>
<body>
    <div class="slide-container flex">
        <!-- Left Content Section -->
        <div class="w-3/5 flex flex-col justify-center px-20">
            <div class="decorative-line mb-8"></div>
            
            <h1 class="title-text mb-6">
                Lentes<br>
                <span class="gold-accent">FullRange</span><br>
                Hanita
            </h1>
            
            <h2 class="subtitle-text mb-8">
                Excelência em<br>
                Visão Multifocal
            </h2>
            
            <p class="tagline-text">
                Visão Além do Comum
            </p>
        </div>
        
        <!-- Right Image Section -->
        <div class="w-2/5 relative">
            <div class="absolute inset-0 bg-gradient-to-br from-blue-50 to-white"></div>
            <img src="/home/ubuntu/hanita_presentation/images/generated_fullrange_hero.png" 
                 alt="Visão em múltiplas distâncias" 
                 class="absolute inset-0 w-full h-full object-contain p-8"
                 style="object-position: center;">
        </div>
    </div>
</body>
</html>
