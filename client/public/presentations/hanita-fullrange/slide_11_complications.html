<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Segurança Superior</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            font-family: 'Open Sans', sans-serif;
        }
        .page-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: #2c3e50;
            font-size: 36px;
        }
        .body-text {
            font-family: 'Open Sans', sans-serif;
            color: #34495e;
            font-size: 18px;
            line-height: 1.6;
        }
        .highlight-stat {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 20px;
        }
        .reduction-badge {
            display: inline-block;
            background: #2ecc71;
            color: white;
            padding: 4px 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="slide-container flex flex-col p-16">
        <!-- Title -->
        <div class="mb-8">
            <h1 class="page-title">Perfil de Segurança Superior</h1>
            <div class="w-24 h-1 bg-gradient-to-r from-yellow-600 to-blue-900 mt-4"></div>
        </div>
        
        <!-- Content Grid -->
        <div class="flex gap-10 items-center" style="min-height: 550px;">
            <!-- Left: Chart -->
            <div class="w-2/3 flex flex-col items-center justify-center">
                <img src="/home/ubuntu/hanita_presentation/images/chart_complications.png" 
                     alt="Gráfico comparativo de complicações" 
                     class="object-contain"
                     style="max-height: 480px; width: 100%;">
            </div>
            
            <!-- Right: Key Points and Technical Image -->
            <div class="w-1/3 flex flex-col justify-center gap-6">
                <!-- Key Reductions -->
                <div>
                    <p class="highlight-stat mb-3" style="color: #2c3e50;">Reduções Significativas:</p>
                    
                    <div class="mb-4">
                        <p class="body-text mb-1"><strong>Taxa de YAG</strong></p>
                        <p class="highlight-stat" style="color: #2ecc71;">8% vs 22%</p>
                        <span class="reduction-badge">↓ 64%</span>
                    </div>
                    
                    <div class="mb-4">
                        <p class="body-text mb-1"><strong>Halos Severos</strong></p>
                        <p class="highlight-stat" style="color: #2ecc71;">5% vs 18%</p>
                        <span class="reduction-badge">↓ 72%</span>
                    </div>
                    
                    <div class="mb-4">
                        <p class="body-text mb-1"><strong>Perda de Contraste</strong></p>
                        <p class="highlight-stat" style="color: #2ecc71;">3% vs 15%</p>
                        <span class="reduction-badge">↓ 80%</span>
                    </div>
                </div>
                
                <!-- Technical Image -->
                <div class="flex flex-col items-center">
                    <img src="/home/ubuntu/upload/search_images/94Qyj6Fqttse.png" 
                         alt="Tecnologia difrativa da lente" 
                         class="object-contain"
                         style="max-height: 180px; width: auto;">
                    <p class="body-text text-center mt-3" style="font-size: 14px; color: #34495e;">Tecnologia difrativa apodizada reduz fenômenos fóticos indesejados</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
