<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            font-family: 'Open Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .thank-you-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            color: #2c3e50;
            font-size: 60px;
            text-align: center;
            margin-bottom: 20px;
        }
        .main-message {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: #c9a961;
            font-size: 28px;
            text-align: center;
            line-height: 1.3;
            margin-bottom: 24px;
        }
        .pillars-container {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .pillar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .pillar-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pillar-icon i {
            font-size: 24px;
            color: #c9a961;
        }
        .pillar-text {
            font-family: 'Open Sans', sans-serif;
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
            text-align: center;
        }
        .contact-text {
            font-family: 'Open Sans', sans-serif;
            color: #34495e;
            font-size: 18px;
            text-align: center;
        }
        .website-link {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: #3498db;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Thank You Title -->
        <h1 class="thank-you-title">Obrigado</h1>
        
        <!-- Main Message -->
        <p class="main-message">
            FullRange Hanita<br>
            A Escolha para Excelência em Visão Multifocal
        </p>
        
        <!-- Decorative Line -->
        <div style="width: 200px; height: 3px; background: linear-gradient(90deg, #2c3e50 0%, #c9a961 50%, #2c3e50 100%); margin-bottom: 20px;"></div>
        
        <!-- Supporting Image -->
        <div style="margin-bottom: 20px;">
            <img src="/home/ubuntu/hanita_presentation/images/generated_patient_satisfaction.png" 
                 alt="Parceria de sucesso" 
                 class="object-contain"
                 style="max-height: 160px;">
        </div>
        
        <!-- Three Pillars -->
        <div class="pillars-container">
            <div class="pillar-item">
                <div class="pillar-icon">
                    <i class="fas fa-eye"></i>
                </div>
                <p class="pillar-text">Liberdade<br>Visual Total</p>
            </div>
            
            <div class="pillar-item">
                <div class="pillar-icon">
                    <i class="fas fa-microscope"></i>
                </div>
                <p class="pillar-text">Ciência<br>Comprovada</p>
            </div>
            
            <div class="pillar-item">
                <div class="pillar-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <p class="pillar-text">Segurança<br>Superior</p>
            </div>
        </div>
        
        <!-- Contact Information -->
        <div style="margin-top: 24px;">
            <p class="contact-text">
                Para mais informações, visite<br>
                <span class="website-link">www.hanitalenses.com</span>
            </p>
        </div>
    </div>
</body>
</html>
